# N items
# minimize sum( grounded * EBO(s_j) + cost_j * s_j ), for j in {1,2,3,...,N}
# r and brt follow the aula's own worked numerical example (slide 8):
# 30% of failures are repaired at the base itself, in 3 days.

[[part]]
name   = "Part_01"
cost   = 9000.00 # the purchase price of LRUi, also viewed as investment cost
lambda_ = 0.00001 # the constant failure rate (or demand rate)
qpa    = 1       # the demand rate is proportional to the quantity per assembly
drt    = 50.0     # depot repair time in days (mean)
r      = 0.3      # fraction of demand repaired at the base
brt    = 3.0      # base repair time in days (mean)

